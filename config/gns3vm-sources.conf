# GNS3 VM source repositories
#
# This file is sourced by the GNS3 VM installation, upgrade and restore
# scripts. It tells them where the VM pulls GNS3 from, so that a VM can be
# built from (and kept on) a fork instead of the official GNS3 repositories.
#
# Precedence: environment variables, then this file, then the defaults below.
# The environment is the easy way to override a build, for example:
#
#   GNS3_SERVER_REPO=myuser/gns3-server ./release_vmware.sh 3.1
#
# The installed copy of this file lives in /etc/gns3vm-sources.conf.

# gns3-vm repository, used by the VM to update and restore itself
: "${GNS3_VM_REPO:=GNS3/gns3-vm}"
# branch used for stable upgrades
: "${GNS3_VM_BRANCH:=resolute-stable}"
# branch used for development (3.xdev) upgrades
: "${GNS3_VM_DEV_BRANCH:=resolute-unstable}"

# gns3-server repository, and the branch, tag or commit to install.
# An empty GNS3_SERVER_REF means the default of the release channel: the
# version tag for the 2.2 channel, the development branch for 3.1dev.
# The 3.1 channel installs the official package from PyPI, unless
# GNS3_SERVER_REF is set, in which case that ref is installed from
# GNS3_SERVER_REPO instead.
: "${GNS3_SERVER_REPO:=GNS3/gns3-server}"
: "${GNS3_SERVER_REF:=}"

# gns3-web-ui repository and ref, used to build the development web UI.
# The web UI is only rebuilt when the default development ref (3.1) of
# gns3-server is installed.
: "${GNS3_WEB_UI_REPO:=GNS3/gns3-web-ui}"
: "${GNS3_WEB_UI_REF:=3.1}"

export GNS3_VM_REPO GNS3_VM_BRANCH GNS3_VM_DEV_BRANCH
export GNS3_SERVER_REPO GNS3_SERVER_REF
export GNS3_WEB_UI_REPO GNS3_WEB_UI_REF
